name: Seed market breadth (prod Redis)

# Barchart's $S5TW/$S5FI/$S5TH breadth symbols went behind an AWS WAF
# JavaScript challenge (confirmed live 2026-09-29: the response is a
# challenge.js page from every egress tried, not a quote page -- not an IP
# block, so a proxy doesn't fix it). scripts/seed-market-breadth.mjs now
# computes the same three readings itself: pulls the live S&P 500
# constituent list from Wikipedia, then fetches a year of daily closes per
# symbol via this repo's existing Yahoo chart helper to work out whether
# each stock sits above its own 20/50/200-day SMA.
#
# Separate from seed-all.yml (excluded there, see that workflow's own
# comment): ~500 staggered Yahoo calls takes several minutes, far past
# seed-all's 90s-per-script budget. The 30-day TTL on this key means once a
# day is already more than enough, so this doesn't need seed-all's 3h cron
# cadence either.

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: seed-market-breadth
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute and cache market breadth
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/seed-market-breadth.mjs
